<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Красивая страница регистрации — моё портфолио">
        <title>Красивый Log In</title>
        <link rel="stylesheet" href="log_in_1_styles.css">
    </head>
    <body>
        <section>
            <div class="rt container">
                <div class="col-rt-12">
                    <div class="Scriptcontent">
                        <form class="codehim-form">
                            <div class="form-title">
                                <div class="user-icon gr-bg">
                                    <i class="fa-user"></i>
                                </div>
                                <h2> CSS Login form</h2>
                            </div>
                            <label for="email"><i class="fa fa-envelope"></i> Email:</label>
                            <input type="email" id="email" class="cm-input" placeholder="Enter your email adress">
                            <label for="pass"><i class="fa fa-lock"></i> Password:</label>
                            <input type="password" id="pass" class="cm-input" placeholder="Enter your password">
                            <button type="submit" class="btn-login  gr-bg">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
